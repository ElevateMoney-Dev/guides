<style>
:root{--bg:#f5f7f8;--card:#fff;--ink:#17232b;--soft:#51626d;--line:#d5dde2;--accent:#0b6b6f;--conf:#a3262a;--conf-soft:#fbe9e9}
@media (prefers-color-scheme:dark){:root{--bg:#10181c;--card:#172228;--ink:#e6edf0;--soft:#9fb0ba;--line:#2b3a42;--accent:#5fc9c4;--conf:#f19a9a;--conf-soft:#3a1717;color-scheme:dark}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 "IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif;padding:16px;box-sizing:border-box}
form{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:22px}
.conf{align-self:flex-start;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--conf);background:var(--conf-soft);border:1px solid var(--conf);border-radius:999px;padding:3px 11px}
p{margin:0;color:var(--soft);font-size:14px}
input{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:600 15px inherit;padding:10px;border:0;border-radius:8px;background:var(--accent);color:var(--card);cursor:pointer}
.err{color:var(--conf);font-size:14px;min-height:1.2em}
